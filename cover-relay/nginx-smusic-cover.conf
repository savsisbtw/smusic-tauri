server {
    listen 443 ssl;
    server_name rpc.savsis.xyz;

    ssl_certificate /etc/letsencrypt/live/rpc.savsis.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.savsis.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name rpc.savsis.xyz;
    return 301 https://$host$request_uri;
}
